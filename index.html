<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Lector de artículos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lector">
<meta name="theme-color" content="#F6F5F1">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1B1A17; --muted:#6E6A61; --line:#E3E0D8;
  --accent:#1F6F63; --accent-ink:#FFFFFF; --danger:#B4423A;
  --bar:rgba(246,245,241,.94); --paper:#FBFAF7;
  --hl-yellow:rgba(255,228,92,.75); --hl-green:rgba(158,227,155,.7); --hl-blue:rgba(156,203,255,.7); --hl-pink:rgba(255,179,199,.7);
  --sw-yellow:#FFE45C; --sw-green:#9EE39B; --sw-blue:#9CCBFF; --sw-pink:#FFB3C7;
  --fs:18px; --lh:1.55;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1E2023; --ink:#E6E3DC; --muted:#9A968D; --line:#2C2F34;
    --accent:#5FBFAF; --accent-ink:#0F1A18; --danger:#E0736A; --bar:rgba(20,21,23,.94); --paper:#17181B;
    --hl-yellow:rgba(255,214,60,.42); --hl-green:rgba(120,210,120,.4); --hl-blue:rgba(110,170,255,.42); --hl-pink:rgba(255,140,170,.42);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1E2023; --ink:#E6E3DC; --muted:#9A968D; --line:#2C2F34;
  --accent:#5FBFAF; --accent-ink:#0F1A18; --danger:#E0736A; --bar:rgba(20,21,23,.94); --paper:#17181B;
  --hl-yellow:rgba(255,214,60,.42); --hl-green:rgba(120,210,120,.4); --hl-blue:rgba(110,170,255,.42); --hl-pink:rgba(255,140,170,.42);
  color-scheme:dark;
}

/* ---------- Base ---------- */
html,body{height:100%;box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}
.screen{height:100%;display:flex;flex-direction:column;min-height:0;}

/* ---------- Top bars ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bar);
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none;}
.topbar h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;padding-left:4px;}
.primary{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;}
.icon{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.icon:active{background:var(--line);}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.doctitle{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding:6px 9px;border-radius:999px;border:1px solid var(--line);flex:none;white-space:nowrap;}

/* ---------- Library ---------- */
.doclist{flex:1;overflow:auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 12px 14px;text-align:left;width:100%;}
.doc:active{background:var(--line);}
.doc .thumb{width:38px;height:48px;border-radius:5px;background:var(--line);flex:none;position:relative;overflow:hidden;}
.doc .thumb i{position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:rgba(127,127,127,.35);}
.doc .thumb i:nth-child(1){top:9px;width:60%;}.doc .thumb i:nth-child(2){top:16px;}.doc .thumb i:nth-child(3){top:23px;}.doc .thumb i:nth-child(4){top:30px;width:40%;}
.doc .thumb b{position:absolute;left:6px;right:14px;top:15px;height:5px;border-radius:2px;background:var(--sw-yellow);opacity:.9;}
.doc .info{flex:1;min-width:0;}
.doc .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc .meta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
.doc .more{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;}
.empty{margin:auto;padding:24px;text-align:center;color:var(--muted);max-width:32ch;}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}
.empty p{margin:0 0 14px;}
.progress{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:40;font-size:14px;}
.progress .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden;}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}

/* ---------- Reader (texto reflujo) ---------- */
#scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);overscroll-behavior:contain;position:relative;}
article{max-width:42em;margin:0 auto;padding:18px 18px 40vh;font-size:var(--fs);line-height:var(--lh);
  font-family:Georgia,"Times New Roman","Iowan Old Style",serif;-webkit-user-select:text;user-select:text;}
article.sans{font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;}
.blk{position:relative;margin:0 0 .85em;}
.blk .tx{margin:0;text-wrap:pretty;overflow-wrap:break-word;}
.blk.title .tx{font-size:1.45em;line-height:1.25;font-weight:700;margin:.2em 0 .6em;text-wrap:balance;}
.blk.h1 .tx{font-size:1.28em;line-height:1.3;font-weight:700;margin:1.3em 0 .5em;}
.blk.h2 .tx{font-size:1.15em;line-height:1.3;font-weight:700;margin:1.2em 0 .45em;}
.blk.h3 .tx{font-size:1em;font-weight:700;margin:1em 0 .35em;}
.blk.caption .tx,.blk.footnote .tx{font-size:.84em;color:var(--muted);line-height:1.45;}
.blk.footnote{margin-top:1.2em;border-left:2px solid var(--line);padding-left:10px;}
.blk.ref .tx{font-size:.84em;line-height:1.45;color:var(--muted);margin-bottom:.5em;}
.refs summary{cursor:pointer;font-weight:700;margin:1.4em 0 .6em;font-size:1.05em;}
.refs summary::-webkit-details-marker{color:var(--muted);}
figure{margin:1.2em 0;}
figure .fig{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line);}
figure .fig.nomatch{padding:24px;box-sizing:border-box;text-align:center;color:var(--muted);font-size:.9em;}
figcaption{font-size:.84em;color:var(--muted);line-height:1.45;margin-top:.5em;}
figure .zoomhint{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;font-family:-apple-system,system-ui,sans-serif;}
figure .wrap{position:relative;}
.pagemark{text-align:right;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:1.6em 0 .6em;font-family:-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;border-top:1px dashed var(--line);padding-top:4px;}
.hl{border-radius:2px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.hl.yellow{background:var(--hl-yellow);} .hl.green{background:var(--hl-green);} .hl.blue{background:var(--hl-blue);} .hl.pink{background:var(--hl-pink);}
.hl.noted::after{content:"✎";font-size:.7em;color:var(--accent);margin-left:2px;vertical-align:super;font-family:-apple-system,system-ui,sans-serif;}
.hl.flash{outline:2px solid var(--accent);outline-offset:2px;}
.bnote{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:8px;background:var(--sw-yellow);color:#3B3200;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2;font-family:-apple-system,system-ui,sans-serif;}
sup,sub{font-size:.7em;line-height:0;}
article ::selection{background:rgba(31,111,99,.3);}
.reading-progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0;z-index:5;}

/* Selection toolbar */
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20;max-width:calc(100% - 32px);touch-action:none;}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.08);flex:none;}
.swatch.on{outline:3px solid var(--accent);outline-offset:2px;}
.swatch[data-color="yellow"]{background:var(--sw-yellow);} .swatch[data-color="green"]{background:var(--sw-green);}
.swatch[data-color="blue"]{background:var(--sw-blue);} .swatch[data-color="pink"]{background:var(--sw-pink);}
.selbar .sep{width:1px;height:26px;background:var(--line);}
.selbar .txt{font-weight:600;font-size:14px;padding:6px 8px;border-radius:8px;white-space:nowrap;}
#readerWrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}

/* ---------- Visor de imagen / página original ---------- */
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;color:#fff;background:rgba(0,0,0,.6);z-index:2;}
.viewer .vbar .icon{color:#fff;} .viewer .vbar .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer .stage{flex:1;overflow:hidden;position:relative;touch-action:none;}
.viewer .stage > *{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none;}
.viewer .stage canvas{background:#fff;}

/* ---------- Sheets & toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;box-shadow:0 -8px 30px rgba(0,0,0,.2);}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
.sheet h2{font-size:16px;margin:0 0 10px;}
.sheet .item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px;}
.sheet .item:last-child{border-bottom:0;}
.sheet .item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted);}
.sheet .item.danger{color:var(--danger);} .sheet .item.danger svg{color:var(--danger);}
.sheet .item small{color:var(--muted);margin-left:auto;font-size:13px;}
.sheet .quote{border-left:3px solid var(--sw-yellow);padding:6px 10px;margin:0 0 12px;color:var(--ink);background:var(--bg);border-radius:0 8px 8px 0;font-size:14.5px;max-height:30vh;overflow:auto;}
.sheet textarea,.sheet input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;}
.sheet textarea{min-height:96px;resize:vertical;}
.sheet .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.sheet .row .primary{flex:1;text-align:center;padding:12px;}
.sheet .row .ghost{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);font-weight:600;}
.sheet .row .ghost.danger{color:var(--danger);}
.sheet .swatches{display:flex;gap:12px;margin:4px 0 14px;}
.sheet .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;font-weight:600;}
.sheet .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.sheet .seg button{flex:1;padding:10px;font-weight:600;} .sheet .seg button.on{background:var(--accent);color:var(--accent-ink);}
.notes .n{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.notes .n .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;}
.notes .n .t{flex:1;min-width:0;font-size:14.5px;}
.notes .n .t .q{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.notes .n .t .nt{color:var(--muted);font-size:13.5px;margin-top:3px;}
.notes .pg{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:14px 0 2px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));pointer-events:none;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);}
@media (prefers-reduced-motion: reduce){ .progress .bar i{transition:none;} }
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}</style>
</head>
<body>
<div id="app">
  <!-- ===== Biblioteca ===== -->
  <section id="library" class="screen">
    <header class="topbar">
      <h1>Lector</h1>
      <button id="importBtn" class="primary">Importar PDF</button>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
    </header>
    <div id="docList" class="doclist"></div>
    <div id="emptyState" class="empty" hidden>
      <strong>Sin artículos todavía</strong>
      <p>Importa un PDF desde Archivos, iCloud o el correo. El texto se adapta a la pantalla del móvil y las figuras se recortan para verlas a pantalla completa.</p>
      <button class="primary" id="importBtn2">Importar PDF</button>
    </div>
    <div id="importProgress" class="progress" hidden><div id="progressText">Analizando…</div><div class="bar"><i id="progressBar"></i></div></div>
  </section>

  <!-- ===== Lector ===== -->
  <section id="reader" class="screen" hidden>
    <header class="topbar">
      <button id="backBtn" class="icon" aria-label="Volver a la biblioteca"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="doctitle" id="docTitle"></div>
      <button id="pageBtn" class="pill" aria-label="Página actual">p. <span id="pageNow">1</span>/<span id="pageTotal">–</span></button>
      <button id="fontBtn" class="icon" aria-label="Texto"><svg viewBox="0 0 24 24"><path d="M4 18L10 5l6 13M6.5 13h7M17 11l2.5-5 2.5 5"/></svg></button>
      <button id="notesBtn" class="icon" aria-label="Subrayados y notas"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button id="menuBtn" class="icon" aria-label="Más opciones"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    </header>
    <div id="readerWrap">
      <div id="rprog" class="reading-progress"></div>
      <div id="scroll"><article id="art"></article></div>
      <div id="selbar" class="selbar" hidden>
        <button class="swatch" data-color="yellow" aria-label="Subrayar amarillo"></button>
        <button class="swatch" data-color="green" aria-label="Subrayar verde"></button>
        <button class="swatch" data-color="blue" aria-label="Subrayar azul"></button>
        <button class="swatch" data-color="pink" aria-label="Subrayar rosa"></button>
        <span class="sep"></span>
        <button class="txt" data-color="note">+ Nota</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

/* =====================================================================
   reflow.js — convierte un PDF (vía pdf.js) en un artículo "líquido":
   bloques de texto (título, encabezados, párrafos, pies de figura) y
   figuras recortadas, en orden de lectura, con un mapa de cada carácter
   a su posición en el PDF original (para volver a escribir subrayados).
   Funciona igual en el navegador y en Node (pruebas).
   ===================================================================== */

const BOLD_RE = /bold|black|heavy|semibold|demi|-medi\b|\.b\b|,b(?:old)?$/i;
const ITALIC_RE = /italic|oblique|-ital|slant|\.i\b/i;
const CAPTION_RE = /^(fig(?:ure|\.)?|figura|table|tabla|supplementary (?:fig|table)|scheme|box)\s*S?\d+[A-Za-z]?[\s.:|–-]/i;
const REFS_RE = /^(references?|bibliography|bibliograf[ií]a|referencias|literature cited)\s*\.?$/i;

async function analyzePdf(pdf, opts = {}) {
  const { onProgress, renderCrop, OPS } = opts;
  const n = pdf.numPages;
  const pages = [];
  for (let p = 1; p <= n; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const W = vp.width, H = vp.height;
    const ol = await page.getOperatorList();
    const figures = findFigures(ol, OPS, W, H);
    const tc = await page.getTextContent();
    const fontInfo = fn => {
      let name = "";
      try { name = page.commonObjs.has(fn) ? (page.commonObjs.get(fn)?.name || "") : ""; } catch {}
      return { bold: BOLD_RE.test(name), italic: ITALIC_RE.test(name) };
    };
    const items = collectItems(tc, fontInfo, W, H);
    // texto dentro de una figura (etiquetas de ejes, etc.) no va al flujo; amplía la figura para abarcarlo
    for (const it of items) {
      const f = figures.find(f => it.cx >= f.x0 - 2 && it.cx <= f.x1 + 2 && it.cy >= f.y0 - 2 && it.cy <= f.y1 + 2);
      if (f) { it.inFig = true; f.x0 = Math.min(f.x0, it.x0); f.x1 = Math.max(f.x1, it.x1); f.y0 = Math.min(f.y0, it.y0); f.y1 = Math.max(f.y1, it.y1); }
    }
    // etiquetas justo encima/debajo/al lado de una figura (títulos de panel) también pertenecen a ella
    for (let pass = 0; pass < 2; pass++) for (const it of items) {
      if (it.inFig || it.size > 11.5) continue;
      const f = figures.find(f => {
        const ov = Math.min(it.x1, f.x1) - Math.max(it.x0, f.x0);
        const nearV = it.y0 >= f.y0 - 14 && it.y1 <= f.y1 + 14;        // justo encima o debajo, con solape horizontal
        const nearH = it.y0 >= f.y0 - 2 && it.y1 <= f.y1 + 2 && (it.x1 >= f.x0 - 24 && it.x0 <= f.x1 + 24); // a un lado
        return (nearV && ov >= (it.x1 - it.x0) * 0.3) || nearH;
      });
      if (f && !CAPTION_RE.test(it.str)) { it.inFig = true; f.x0 = Math.min(f.x0, it.x0); f.x1 = Math.max(f.x1, it.x1); f.y0 = Math.min(f.y0, it.y0); f.y1 = Math.max(f.y1, it.y1); }
    }
    const lines = buildLines(items.filter(it => !it.inFig));
    pages.push({ p, W, H, lines, figures, page });
    onProgress?.(p / n * 0.6, `Analizando página ${p} de ${n}`);
  }
  const body = bodySize(pages);
  dropHeadersFooters(pages, body);

  // --- bloques por página en orden de lectura ---
  const blocks = [];
  for (const pg of pages) {
    const captions = pg.lines.filter(l => CAPTION_RE.test(l.text) || (l.size < body * 0.92 && /^(fig|tab)/i.test(l.text)));
    const capSet = new Set();
    // un pie de figura incluye las líneas siguientes contiguas del mismo tamaño
    for (const c of captions) { capSet.add(c); let cur = c; for (;;) { const nx = nextLineBelow(pg.lines, cur); if (!nx || capSet.has(nx) || Math.abs(nx.size - cur.size) > 0.6 || (cur.y0 - nx.y1) > cur.size * 0.9 || CAPTION_RE.test(nx.text)) break; capSet.add(nx); cur = nx; } }
    const flow = pg.lines.filter(l => !capSet.has(l));
    const leaves = xyCut(flow, body);
    const paras = [];
    for (const leaf of leaves) paras.push(...linesToParagraphs(leaf, body, pg.p));

/* Recorta las figuras de una página renderizándola una vez a buena resolución */
const cropCanvas = document.createElement("canvas");
async function renderCrop(page, rects) {
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(3, 1800 / base.width, Math.sqrt(9e6 / (base.width * base.height)));
  const vp = page.getViewport({ scale });
  cropCanvas.width = Math.round(vp.width); cropCanvas.height = Math.round(vp.height);
  const ctx = cropCanvas.getContext("2d", { alpha: false });
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const out = [];
  for (const r of rects) {
    const [a, b, c, d] = vp.convertToViewportRectangle(r);
    const x = Math.floor(Math.min(a, c)), y = Math.floor(Math.min(b, d)), w = Math.ceil(Math.abs(c - a)), h = Math.ceil(Math.abs(d - b));
    const cc = document.createElement("canvas"); cc.width = Math.max(1, w); cc.height = Math.max(1, h);
    cc.getContext("2d").drawImage(cropCanvas, x, y, w, h, 0, 0, w, h);
    out.push(await new Promise(res => cc.toBlob(res, w * h > 250000 ? "image/jpeg" : "image/png", 0.88)));
  }
  cropCanvas.width = 0; cropCanvas.height = 0;
  return out;
}

/* Subrayados que ya traiga el PDF (de esta u otra app) → anotaciones sobre el texto líquido */
async function importExistingAnnots(pdf, reflow) {
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    let list; try { list = await (await pdf.getPage(p)).getAnnotations(); } catch { continue; }
    for (const a of list) {
      if (a.subtype === "Highlight") {
        const rects = quadsToRects(a.quadPoints, a.rect); if (!rects.length) continue;
        const hit = locateRects(reflow, p, rects); if (!hit) continue;
        out.push({ id: uid(), block: hit.block, s: hit.s, e: hit.e, text: hit.text, color: nearestColor(a.color), note: a.contentsObj?.str || a.contents || "", created: Date.now() });
      } else if (a.subtype === "Text" && !a.inReplyTo) {
        const b = reflow.blocks.find(b => b.page === p && b.type !== "fig") || reflow.blocks[0];
        if (b) out.push({ id: uid(), block: b.id, s: 0, e: 0, text: "", color: "yellow", note: a.contentsObj?.str || a.contents || "", created: Date.now() });
      }
    }
  }
  return out;
}
/* Rectángulos PDF → (bloque, inicio, fin) usando el mapa de runs */
function locateRects(reflow, page, rects) {
  let best = null;
  for (const b of reflow.blocks) {
    for (const [bid, runs, text] of blockRunSets(b)) {
      let pos = 0, s = -1, e = -1;
      for (const r of runs) {
        const len = r.s.length;
        if (r.r && r.p === page && len) {
          const [x0, y0, x1, y1] = r.r; const cy = (y0 + y1) / 2, w = x1 - x0;
          for (const [rx0, ry0, rx1, ry1] of rects) {
            if (cy < ry0 - 1 || cy > ry1 + 1) continue;
            const ox0 = Math.max(x0, rx0), ox1 = Math.min(x1, rx1); if (ox1 - ox0 < Math.min(2, w * 0.5)) continue;
            // parte del run cubierta por el rectángulo, en caracteres (proporcional)
            const cs = pos + Math.round((ox0 - x0) / w * len), ce = pos + Math.round((ox1 - x0) / w * len);
            if (s < 0 || cs < s) s = cs; if (ce > e) e = ce;
          }
        }
        pos += len;
      }
      if (s >= 0 && e > s && (!best || e - s > best.e - best.s)) best = { block: bid, s, e, text: text.slice(s, e) };
    }
  }
  return best;
}
function blockRunSets(b) { if (b.type === "fig") return b.caption ? [[b.id + "c", b.captionRuns, b.caption]] : []; return [[b.id, b.runs, b.text]]; }
function quadsToRects(q, rect) {
  if (!q) return rect ? [[Math.min(rect[0], rect[2]), Math.min(rect[1], rect[3]), Math.max(rect[0], rect[2]), Math.max(rect[1], rect[3])]] : [];
  const rects = [];
  if (Array.isArray(q) && q.length && typeof q[0] === "object" && !ArrayBuffer.isView(q[0])) {
    for (const quad of q) { const xs = quad.map(pt => pt.x), ys = quad.map(pt => pt.y); rects.push([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]); }
  } else { const flat = Array.from(q); for (let i = 0; i + 7 < flat.length; i += 8) { const xs = [flat[i], flat[i + 2], flat[i + 4], flat[i + 6]], ys = [flat[i + 1], flat[i + 3], flat[i + 5], flat[i + 7]]; rects.push([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]); } }
  return rects;
}

  if (!c) return "yellow"; const [r, g, b] = [c[0] / 255, c[1] / 255, c[2] / 255];

  return best;
}

/* Texto de un bloque → HTML con negritas/cursivas/superíndices y subrayados, sin alterar los caracteres */
function textHtml(b, bid) {

  const annots = R.doc ? R.doc.annots.filter(a => a.block === bid && a.e > a.s) : [];
  const cuts = new Set([0, text.length]);
  for (const s of spans) { cuts.add(s.s); cuts.add(s.e); } for (const a of annots) { cuts.add(a.s); cuts.add(a.e); }
  const pts = [...cuts].filter(v => v >= 0 && v <= text.length).sort((a, b) => a - b);

}

/* Rango DOM → anotaciones (una por bloque de texto tocado), con offsets sobre el texto del bloque */

  const out = [];

    const bid = el.dataset.b || el.closest("[data-b]")?.dataset.b; if (!bid) continue;
    const b = R.blockIndex.get(bid); if (!b) continue;
    const s = el.contains(range.startContainer) ? offsetIn(el, range.startContainer, range.startOffset) : 0;
    const e = el.contains(range.endContainer) ? offsetIn(el, range.endContainer, range.endOffset) : el.textContent.length;
    const text = b.text.slice(s, e).trim(); if (!text || e <= s) continue;

}

/* =====================================================================
   EXPORTACIÓN
   ===================================================================== */
async function shareFile(bytes, name, type) {
  const blob = new Blob([bytes], { type }); const file = new File([blob], name, { type });
  try { const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename: name, data: blob }); toast("Guardado"); } catch (err) { if (err?.code !== "declined") toast("No se pudo guardar: " + (err?.message || err), 4000); } return; } } catch {}
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } }
  catch (err) { if (err.name === "AbortError") return; console.warn(err); }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function toMarkdown(d, reflow) {
  const order = new Map(reflow.blocks.map((b, i) => [b.id, i]));
  const byId = new Map(reflow.blocks.map(b => [b.id, b]));
  const heading = bid => { let i = order.get(bid.replace(/c$/, "")) ?? 0; for (; i >= 0; i--) { const b = reflow.blocks[i]; if (/^h[123]$/.test(b.type)) return b.text; } return null; };
  const list = [...d.annots].sort((x, y) => ((order.get(x.block.replace(/c$/, "")) ?? 0) * 1e6 + x.s) - ((order.get(y.block.replace(/c$/, "")) ?? 0) * 1e6 + y.s));
  const nH = list.filter(a => a.e > a.s).length, nN = list.filter(a => a.note).length;
  let md = `# ${d.name}\n\n_Exportado el ${fmtDate(Date.now())} · ${nH} subrayados · ${nN} notas_\n`;
  let lastH = undefined;
  for (const a of list) {
    const h = heading(a.block); const p = byId.get(a.block.replace(/c$/, ""))?.page;
    if (h !== lastH) { md += `\n## ${h || "Inicio"}\n\n`; lastH = h; }
    if (a.e > a.s) { md += `- ==${a.text}== _(p. ${p})_\n`; if (a.note) md += `  > ${a.note.replace(/\n/g, "\n  > ")}\n`; }
    else md += `- **Nota** _(p. ${p})_: ${a.note.replace(/\n/g, " ")}\n`;
  }
  return md;
}
async function exportMd(d) {
  if (!d.annots.length) { toast("No hay anotaciones que exportar"); return; }
  const reflow = R.reflow && R.doc?.id === d.id ? R.reflow : await DB.getReflow(d.id);
  await shareFile(new TextEncoder().encode(toMarkdown(d, reflow)), `${d.name.slice(0, 60)} - apuntes.md`, "text/markdown");
}
/* Offsets de una anotación → rectángulos PDF por página (a través de los runs) */
function annotRects(a, block) {
  const runs = block.runs || []; const byPage = new Map(); let pos = 0;
  for (const r of runs) {
    const len = r.s.length, rs = pos, re = pos + len; pos = re;
    if (!r.r || re <= a.s || rs >= a.e) continue;
    const [x0, y0, x1, y1] = r.r; const w = x1 - x0;
    const cs = Math.max(a.s, rs), ce = Math.min(a.e, re);
    const fx0 = x0 + w * (cs - rs) / len, fx1 = x0 + w * (ce - rs) / len;
    if (!byPage.has(r.p)) byPage.set(r.p, []);
    const arr = byPage.get(r.p); const last = arr[arr.length - 1];
    if (last && Math.abs(last[1] - y0) < 1 && Math.abs(last[3] - y1) < 1 && fx0 - last[2] < 12) { last[2] = Math.max(last[2], fx1); last[0] = Math.min(last[0], fx0); }

}

  const doc = await PDFDocument.load(buf, { ignoreEncryption: true, updateMetadata: false });
  const ctx = doc.context; const pages = doc.getPages();
  for (const p of pages) {   // el modelo de la app sustituye a las Highlight/Text existentes (se importaron al abrir)
    const annots = p.node.Annots(); if (!annots) continue;
    const keep = ctx.obj([]);
    for (let i = 0; i < annots.size(); i++) { const ref = annots.get(i); const dict = ctx.lookup(ref); const st = dict?.get?.(PDFName.of("Subtype"))?.toString?.(); if (st === "/Highlight" || st === "/Text" || st === "/Popup") continue; keep.push(ref); }

    const block = index.get(a.block); if (!block) continue;
    const common = { Type: "Annot", F: 4, T: PDFHexString.fromText(AUTHOR), Contents: PDFHexString.fromText(a.note || ""), M: PDFString.fromDate(new Date(a.created || Date.now())), CA: 1 };
    if (a.e > a.s) {
      const byPage = annotRects(a, block); let first = true;
      for (const [pn, rects] of byPage) {
        const page = pages[pn - 1]; if (!page || !rects.length) continue;
        const [r, g, b] = COLORS[a.color] || COLORS.yellow;
        const rect = [Math.min(...rects.map(x => x[0])), Math.min(...rects.map(x => x[1])), Math.max(...rects.map(x => x[2])), Math.max(...rects.map(x => x[3]))];
        const quads = rects.flatMap(([x1, y1, x2, y2]) => [x1, y2, x2, y2, x1, y1, x2, y1]);
        const content = `/GS gs ${r} ${g} ${b} rg ` + rects.map(([x1, y1, x2, y2]) => `${x1.toFixed(2)} ${y1.toFixed(2)} ${(x2 - x1).toFixed(2)} ${(y2 - y1).toFixed(2)} re f`).join(" ");
        const ap = ctx.stream(content, { Type: "XObject", Subtype: "Form", BBox: rect, Resources: { ExtGState: { GS: gsRef } } });
        const annot = ctx.obj({ ...common, Contents: PDFHexString.fromText(first ? (a.note || "") : ""), Subtype: "Highlight", Rect: rect, QuadPoints: quads, C: [r, g, b], P: page.ref, NM: PDFString.of(a.id + (first ? "" : "-" + pn)), AP: { N: ctx.register(ap) } });

      }
    } else {
      const page = pages[(block.page || 1) - 1]; if (!page) continue;
      const box = page.getCropBox?.() || page.getMediaBox();
      const runs = (block.runs || []).filter(r => r.r && r.p === block.page);
      const x = runs.length ? Math.min(...runs.map(r => r.r[0])) - 22 : box.x + 8, y = runs.length ? Math.max(...runs.map(r => r.r[3])) : box.y + box.height - 12;
      const annot = ctx.obj({ ...common, Subtype: "Text", Rect: [x, y - 20, x + 20, y], Name: "Comment", C: [1, 0.89, 0.36], Open: false, P: page.ref, NM: PDFString.of(a.id) });
      page.node.addAnnot(ctx.register(annot));
    }
  }
  return doc.save({ useObjectStreams: false });
}
async function exportPdf(d) {
  if (!d.annots.length) { toast("No hay anotaciones que exportar"); return; }
  toast("Preparando PDF…", 1200);
  try { const reflow = R.reflow && R.doc?.id === d.id ? R.reflow : await DB.getReflow(d.id); const bytes = await buildAnnotatedPdf(d, reflow); await shareFile(bytes, `${d.name.slice(0, 60)} (anotado).pdf`, "application/pdf"); }
  catch (err) { console.error(err); toast("No se pudo generar el PDF: " + (err.message || err), 4000); }
}

/* ---------- Arranque ---------- */
applyPrefs();
renderLibrary();
window.lector = { DB, R, openDoc, importFiles, rangeToAnnots, buildAnnotatedPdf, toMarkdown, analyzePdf, prefs };
</script>

if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
