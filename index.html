<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Lector de artículos</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lector">
<meta name="theme-color" content="#F6F5F1">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1B1A17; --muted:#6E6A61; --line:#E3E0D8;
  --accent:#1F6F63; --accent-ink:#FFFFFF; --danger:#B4423A;
  --bar:rgba(246,245,241,.94); --paper:#FBFAF7;
  --hl-yellow:rgba(255,228,92,.75); --hl-green:rgba(158,227,155,.7); --hl-blue:rgba(156,203,255,.7); --hl-pink:rgba(255,179,199,.7);
  --sw-yellow:#FFE45C; --sw-orange:#FFA04D; --sw-green:#9EE39B; --sw-blue:#9CCBFF; --sw-pink:#FFB3C7; --hl-orange:rgba(255,160,77,.6);
  --fs:18px; --lh:1.55;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1E2023; --ink:#E6E3DC; --muted:#9A968D; --line:#2C2F34;
    --accent:#5FBFAF; --accent-ink:#0F1A18; --danger:#E0736A; --bar:rgba(20,21,23,.94); --paper:#17181B;
    --hl-yellow:rgba(255,214,60,.42); --hl-orange:rgba(255,150,60,.45); --hl-green:rgba(120,210,120,.4); --hl-blue:rgba(110,170,255,.42); --hl-pink:rgba(255,140,170,.42);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1E2023; --ink:#E6E3DC; --muted:#9A968D; --line:#2C2F34;
  --accent:#5FBFAF; --accent-ink:#0F1A18; --danger:#E0736A; --bar:rgba(20,21,23,.94); --paper:#17181B;
  --hl-yellow:rgba(255,214,60,.42); --hl-orange:rgba(255,150,60,.45); --hl-green:rgba(120,210,120,.4); --hl-blue:rgba(110,170,255,.42); --hl-pink:rgba(255,140,170,.42);
  color-scheme:dark;
}

/* ---------- Base ---------- */
html,body{height:100%;box-sizing:border-box;}
[hidden]{display:none!important;}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.4 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden;}
.screen{height:100%;display:flex;flex-direction:column;min-height:0;}

/* ---------- Top bars ---------- */
.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bar);
  border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none;}
.topbar h1{font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:-.01em;padding-left:4px;}
.primary{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;}
.icon{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.icon:active{background:var(--line);}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.doctitle{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pill{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);padding:6px 9px;border-radius:999px;border:1px solid var(--line);flex:none;white-space:nowrap;}

/* ---------- Library ---------- */
.chips{display:flex;gap:8px;padding:10px 16px 2px;overflow-x:auto;flex:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.chip .cnt{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums;}
.chip.add{color:var(--accent);border-style:dashed;}
.doc .status{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;margin-right:-4px;}
.doc.read .status{visibility:hidden;}
.sheet .check{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px;}
.sheet .check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent-ink);font-size:14px;}
.sheet .check.on .box{background:var(--accent);border-color:var(--accent);}
.doclist{flex:1;overflow:auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px 12px 14px;text-align:left;width:100%;}
.doc:active{background:var(--line);}
.doc .thumb{width:38px;height:48px;border-radius:5px;background:var(--line);flex:none;position:relative;overflow:hidden;}
.doc .thumb i{position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:rgba(127,127,127,.35);}
.doc .thumb i:nth-child(1){top:9px;width:60%;}.doc .thumb i:nth-child(2){top:16px;}.doc .thumb i:nth-child(3){top:23px;}.doc .thumb i:nth-child(4){top:30px;width:40%;}
.doc .thumb b{position:absolute;left:6px;right:14px;top:15px;height:5px;border-radius:2px;background:var(--sw-yellow);opacity:.9;}
.doc .info{flex:1;min-width:0;}
.doc .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc .meta{font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}
.doc .more{width:36px;height:36px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none;}
.empty{margin:auto;padding:24px;text-align:center;color:var(--muted);max-width:32ch;}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px;}
.empty p{margin:0 0 14px;}
.progress{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:40;font-size:14px;}
.progress .bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden;}
.progress .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s;}

/* ---------- Reader (texto reflujo) ----------
   Sistema visual: el cuerpo en serif; encabezados, pies, notas y tablas en sans, con etiqueta de tipo,
   para que cada clase de bloque se reconozca de un vistazo. */
#scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);overscroll-behavior:contain;position:relative;}
article{max-width:42em;margin:0 auto;padding:18px 18px 40vh;font-size:var(--fs);line-height:var(--lh);
  font-family:Georgia,"Times New Roman","Iowan Old Style",serif;-webkit-user-select:text;user-select:text;--sans:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;}
article.sans{font-family:var(--sans);}
.blk{position:relative;margin:0 0 1.1em;}
.blk .tx{margin:0;text-wrap:pretty;overflow-wrap:break-word;}
.blk.title .tx{font-family:var(--sans);font-size:1.5em;line-height:1.22;font-weight:800;letter-spacing:-.01em;margin:.2em 0 .7em;text-wrap:balance;}
.blk.h1 .tx{font-family:var(--sans);font-size:1.3em;line-height:1.25;font-weight:800;margin:1.6em 0 .5em;letter-spacing:-.01em;}
.blk.h2 .tx{font-family:var(--sans);font-size:1.16em;line-height:1.3;font-weight:750;margin:1.5em 0 .45em;}
.blk.h3 .tx{font-family:var(--sans);font-size:.98em;font-weight:700;margin:1.2em 0 .35em;color:var(--accent);text-transform:none;}
.blk.h1::before,.blk.h2::before{content:"";display:block;width:34px;height:3px;background:var(--accent);border-radius:2px;margin-top:1.2em;}
.blk.h1 .tx,.blk.h2 .tx{margin-top:.5em;}
.blk.li .tx{padding-left:1.1em;text-indent:-1.1em;}
.blk.li .tx::before{content:"•";color:var(--accent);display:inline-block;width:1.1em;text-indent:0;}
.blk.p+.blk.li,.blk.li+.blk.li{margin-top:-.5em;}
.blk.footnote{margin:1.4em 0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 12px;font-family:var(--sans);}
.blk.footnote .tx{font-size:.8em;color:var(--muted);line-height:1.45;margin:0;}
.blk.ref .tx{font-family:var(--sans);font-size:.82em;line-height:1.45;color:var(--muted);margin-bottom:.55em;}
.refs summary{cursor:pointer;font-weight:700;margin:1.6em 0 .6em;font-size:1.05em;font-family:var(--sans);}
.refs summary::-webkit-details-marker{color:var(--muted);}
.kindtag{display:inline-block;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:6px;padding:3px 8px;}
.blk.footnote .kindtag{margin-bottom:6px;}
/* figuras y tablas: tarjeta con cabecera */
figure{margin:1.6em 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
figure .fighead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--sans);}
figure .fighead .spacer{flex:1;}
figure .capbtn,figure .zoombtn{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--bg);}
figure .zoombtn{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);}
figure .wrap{position:relative;}
figure .fig{display:block;width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line);}
figure .fig.nomatch{padding:24px;box-sizing:border-box;text-align:center;color:var(--muted);font-size:.9em;}
figure.table:not(.htmltable) .fig{max-height:38vh;object-fit:cover;object-position:top left;}
figcaption{font-family:var(--sans);font-size:.84em;color:var(--ink);line-height:1.45;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);}
figure .tnote{font-family:var(--sans);font-size:.76em;color:var(--muted);line-height:1.4;margin-top:6px;}
figure .panelstrip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;}
figure .panelstrip::-webkit-scrollbar{display:none;}
figure .panelstrip button{flex:none;width:64px;height:64px;border-radius:8px;border:1px solid var(--line);background:#fff center/cover no-repeat;position:relative;overflow:hidden;}
figure .panelstrip button b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:1px 6px;border-radius:0 6px 0 0;font-family:var(--sans);}
/* tablas HTML */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
.tablewrap table{border-collapse:collapse;font-family:var(--sans);font-size:.78em;line-height:1.35;min-width:100%;}
.tablewrap th,.tablewrap td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;min-width:7em;}
.tablewrap th{font-weight:700;background:var(--bg);position:sticky;top:0;}
.tablewrap tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 60%,transparent);}
.tablewrap td:first-child,.tablewrap th:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;box-shadow:1px 0 0 var(--line);}
.pagemark{text-align:right;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:1.4em 0 .4em;font-family:var(--sans);font-variant-numeric:tabular-nums;}
.hl{border-radius:2px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.hl.yellow{background:var(--hl-yellow);} .hl.orange{background:var(--hl-orange);} .hl.green{background:var(--hl-green);} .hl.blue{background:var(--hl-blue);} .hl.pink{background:var(--hl-pink);}
.hl.ul{background:none!important;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px;text-decoration-skip-ink:none;}
.hl.ul.yellow{text-decoration-color:var(--sw-yellow);} .hl.ul.orange{text-decoration-color:var(--sw-orange);} .hl.ul.green{text-decoration-color:var(--sw-green);} .hl.ul.blue{text-decoration-color:var(--sw-blue);} .hl.ul.pink{text-decoration-color:var(--sw-pink);}
.hl.noted::after{content:"✎";font-size:.7em;color:var(--accent);margin-left:2px;vertical-align:super;font-family:var(--sans);}
.hl.flash{outline:2px solid var(--accent);outline-offset:2px;}
.bnote{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:8px;background:var(--sw-yellow);color:#3B3200;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.25);z-index:2;font-family:var(--sans);}
sup,sub{font-size:.7em;line-height:0;}
article ::selection{background:rgba(31,111,99,.3);}
.reading-progress{position:absolute;left:0;top:0;height:2px;background:var(--accent);width:0;z-index:5;}

/* Selection toolbar */
.selbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20;max-width:calc(100% - 32px);touch-action:none;}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.08);flex:none;}
.swatch.on{outline:3px solid var(--accent);outline-offset:2px;}
.swatch[data-color="yellow"]{background:var(--sw-yellow);} .swatch[data-color="green"]{background:var(--sw-green);}
.swatch[data-color="blue"]{background:var(--sw-blue);} .swatch[data-color="pink"]{background:var(--sw-pink);} .swatch[data-color="orange"]{background:var(--sw-orange);}
.selbar.ul .swatch{background:transparent!important;box-shadow:inset 0 -6px 0 var(--c);}
.selbar .stylebtn{width:40px;height:34px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.selbar .stylebtn .mk{background:var(--sw-yellow);padding:0 3px;border-radius:2px;color:#1B1A17;} .selbar .stylebtn .un{display:none;border-bottom:3px solid var(--sw-yellow);padding:0 3px;}
.selbar.ul .stylebtn .mk{display:none;} .selbar.ul .stylebtn .un{display:inline;}
.selbar .sep{width:1px;height:26px;background:var(--line);}
.selbar .txt{font-weight:600;font-size:14px;padding:6px 8px;border-radius:8px;white-space:nowrap;}
#readerWrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;}

/* ---------- Visor de imagen / página original ---------- */
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column;}
.viewer .vbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;color:#fff;background:rgba(0,0,0,.6);z-index:2;}
.viewer .vbar .icon{color:#fff;} .viewer .vbar .t{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer .stage{flex:1;overflow:hidden;position:relative;touch-action:none;}
.viewer .stage > img,.viewer .stage > canvas{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none;}
.viewer .stage canvas{background:#fff;}

/* Galería de paneles */
.viewer .vbar .pillw{color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;flex:none;}
.viewer .navbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#111;color:#fff;z-index:2;font-family:-apple-system,system-ui,sans-serif;}
.viewer .navbar .nb{display:inline-flex;align-items:center;gap:4px;padding:10px 14px;border-radius:12px;background:#2a2a2e;color:#fff;font-weight:600;font-size:14.5px;min-width:44px;}
.viewer .navbar .nb[disabled]{opacity:.3;}
.viewer .navbar .nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.viewer .navbar .pos{font-variant-numeric:tabular-nums;font-size:14px;opacity:.9;}
.viewer .cap .pcap{font-size:15.5px;line-height:1.4;color:#fff;margin-bottom:6px;}
.viewer .cap .ccap{font-size:12.5px;line-height:1.35;color:#aaa;}
.viewer .cap{background:#000;color:#eee;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.4;max-height:36%;overflow:auto;font-family:-apple-system,system-ui,sans-serif;z-index:2;border-top:1px solid #222;}
.viewer .cap b{color:#fff;background:rgba(255,228,92,.25);border-radius:2px;padding:0 2px;}
.viewer .cap .lbl{display:inline-block;background:#FFE45C;color:#3B3200;font-weight:700;border-radius:6px;padding:0 7px;margin-right:6px;}
.viewer .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.35);border-radius:10px;z-index:3;}
.viewer .arrow.l{left:6px;} .viewer .arrow.r{right:6px;}
.viewer .arrow[disabled]{opacity:.25;}
.viewer .arrow svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.viewer .hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:4;white-space:nowrap;font-family:-apple-system,system-ui,sans-serif;display:flex;gap:8px;align-items:center;}
.viewer .hint svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

/* ---------- Sheets & toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;box-shadow:0 -8px 30px rgba(0,0,0,.2);}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px;}
.sheet h2{font-size:16px;margin:0 0 10px;}
.sheet .item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px;}
.sheet .item:last-child{border-bottom:0;}
.sheet .item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted);}
.sheet .item.danger{color:var(--danger);} .sheet .item.danger svg{color:var(--danger);}
.sheet .item small{color:var(--muted);margin-left:auto;font-size:13px;}
.sheet .quote{border-left:3px solid var(--sw-yellow);padding:6px 10px;margin:0 0 12px;color:var(--ink);background:var(--bg);border-radius:0 8px 8px 0;font-size:14.5px;max-height:30vh;overflow:auto;}
.sheet textarea,.sheet input{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;}
.sheet textarea{min-height:96px;resize:vertical;}
.sheet .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
.sheet .row .primary{flex:1;text-align:center;padding:12px;}
.sheet .row .ghost{flex:1;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);font-weight:600;}
.sheet .row .ghost.danger{color:var(--danger);}
.sheet .swatches{display:flex;gap:12px;margin:4px 0 14px;}
.sheet .label{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px;font-weight:600;}
.sheet .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.sheet .seg button{flex:1;padding:10px;font-weight:600;} .sheet .seg button.on{background:var(--accent);color:var(--accent-ink);}
.notes .n{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.notes .n .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

/* =====================================================================
   reflow.js — convierte un PDF (vía pdf.js) en un artículo "líquido":
   bloques de texto (título, encabezados, párrafos, pies de figura) y
   figuras recortadas, en orden de lectura, con un mapa de cada carácter
   a su posición en el PDF original (para volver a escribir subrayados).
   Funciona igual en el navegador y en Node (pruebas).
   ===================================================================== */

const BOLD_RE = /bold|black|heavy|semibold|demi|-medi\b|\.b\b|,b(?:old)?$/i;
const ITALIC_RE = /italic|oblique|-ital|slant|\.i\b/i;
const CAPTION_RE = /^(fig(?:ure|\.)?|figura|table|tabla|supplementary (?:fig|table)|scheme|box)\s*S?\d+[A-Za-z]?[\s.:|–—-]/i;
const REFS_RE = /^(references?|bibliography|bibliograf[ií]a|referencias|literature cited)\s*\.?$/i;

async function analyzePdf(pdf, opts = {}) {
  const { onProgress, renderCrop, OPS } = opts;
  const n = pdf.numPages;
  const pages = [];
  for (let p = 1; p <= n; p++) {
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const W = vp.width, H = vp.height;
    const ol = await page.getOperatorList();
    const figures = findFigures(ol, OPS, W, H);
    const tc = await page.getTextContent();
    const fontInfo = fn => {
      let name = "";
      try { name = page.commonObjs.has(fn) ? (page.commonObjs.get(fn)?.name || "") : ""; } catch {}
      return { bold: BOLD_RE.test(name), italic: ITALIC_RE.test(name) };
    };
    const items = collectItems(tc, fontInfo, W, H);
    // solo las figuras con entidad gráfica propia absorben texto cercano (evita que un logo se trague el bloque de autores)
    for (const f of figures) f.absorb = (f.x1 - f.x0) * (f.y1 - f.y0) >= 0.05 * W * H;
    // texto dentro de una figura (etiquetas de ejes, etc.) no va al flujo; amplía la figura para abarcarlo
    for (const it of items) {
      const f = figures.find(f => f.absorb && it.cx >= f.x0 - 2 && it.cx <= f.x1 + 2 && it.cy >= f.y0 - 2 && it.cy <= f.y1 + 2);
      if (f) { it.inFig = f; f.x0 = Math.min(f.x0, it.x0); f.x1 = Math.max(f.x1, it.x1); f.y0 = Math.min(f.y0, it.y0); f.y1 = Math.max(f.y1, it.y1); }
    }
    // etiquetas justo encima/debajo/al lado de una figura (títulos de panel) también pertenecen a ella
    for (let pass = 0; pass < 2; pass++) for (const it of items) {
      if (it.inFig || it.size > 11.5) continue;
      const f = figures.find(f => {
        if (!f.absorb) return false;
        const ov = Math.min(it.x1, f.x1) - Math.max(it.x0, f.x0);
        const nearV = it.y0 >= f.y0 - 14 && it.y1 <= f.y1 + 14;        // justo encima o debajo, con solape horizontal
        const nearH = it.y0 >= f.y0 - 2 && it.y1 <= f.y1 + 2 && (it.x1 >= f.x0 - 8 && it.x0 <= f.x1 + 8) && (it.x1 - it.x0) < (f.x1 - f.x0) * 0.5; // etiqueta corta pegada a un lado
        return (nearV && ov >= (it.x1 - it.x0) * 0.3) || nearH;
      });
      if (f && !CAPTION_RE.test(it.str)) { it.inFig = f; f.x0 = Math.min(f.x0, it.x0); f.x1 = Math.max(f.x1, it.x1); f.y0 = Math.min(f.y0, it.y0); f.y1 = Math.max(f.y1, it.y1); }
    }
    for (const f of figures) f.panels = detectPanels(f, items);
    const lines = buildLines(items.filter(it => !it.inFig));
    pages.push({ p, W, H, lines, figures, page });
    onProgress?.(p / n * 0.6, `Analizando página ${p} de ${n}`);
  }
  const body = bodySize(pages);
  dropHeadersFooters(pages, body);

  // --- bloques por página en orden de lectura ---
  const blocks = [];
  for (const pg of pages) {
    const captions = pg.lines.filter(l => CAPTION_RE.test(l.text) || (l.size < body * 0.92 && /^(fig|tab)/i.test(l.text)));
    const capSet = new Set();
    // un pie de figura incluye las líneas siguientes contiguas del mismo tamaño
    for (const c of captions) { capSet.add(c); let cur = c; for (;;) { const nx = nextLineBelow(pg.lines, cur); if (!nx || capSet.has(nx) || Math.abs(nx.size - cur.size) > 0.6 || (cur.y0 - nx.y1) > cur.size * 0.9 || CAPTION_RE.test(nx.text)) break; capSet.add(nx); cur = nx; } }
    const capParas0 = groupCaptions([...capSet], pg, body);
    const hasFig = cp => pg.figures.some(f => Math.min(cp.x1, f.x1) - Math.max(cp.x0, f.x0) > -20 && Math.min(Math.abs(cp.y1 - f.y0), Math.abs(cp.y0 - f.y1)) < body * 6);
    const ruled = detectRuledTables(pg, capParas0.filter(cp => !hasFig(cp)), body);
    pg.figures.push(...ruled);
    const textTables = detectTextTables(pg, capParas0.filter(cp => !hasFig(cp) && !ruled.some(t => t.cap === cp)), body);
    pg.figures.push(...textTables);
    const flow = pg.lines.filter(l => !capSet.has(l) && !l.used);
    const leaves = xyCut(flow, body);
    const paras = [];
    for (const leaf of leaves) paras.push(...linesToParagraphs(leaf, body, pg.p));
    // pies de figura → párrafos aparte, asociados a la figura más cercana
    const capParas = groupCaptions([...capSet], pg, body);
    const nearCap = (cp, f) => (Math.min(cp.x1, f.x1) - Math.max(cp.x0, f.x0) > -20 && Math.min(Math.abs(cp.y1 - f.y0), Math.abs(cp.y0 - f.y1)) < body * 6) || (Math.min(cp.y1, f.y1) - Math.max(cp.y0, f.y0) > 0 && Math.min(Math.abs(cp.x0 - f.x1), Math.abs(cp.x1 - f.x0)) < body * 6);
    pg.figures = pg.figures.filter(f => f.kind === "table" || (f.x1 - f.x0) * (f.y1 - f.y0) >= 0.08 * pg.W * pg.H || capParas.some(cp => nearCap(cp, f)));
    const figBlocks = pg.figures.map(f => ({ type: "fig", page: pg.p, rect: [f.x0, f.y0, f.x1, f.y1], caption: null, x0: f.x0, x1: f.x1, y0: f.y0, y1: f.y1, kind: f.kind || "figure", panels: f.panels || null }));
    for (const cp of capParas) {
      let best = null, bd = 1e9;
      for (const fb of figBlocks) {
        const overlap = Math.min(cp.x1, fb.x1) - Math.max(cp.x0, fb.x0);
        const vOverlap = Math.min(cp.y1, fb.y1) - Math.max(cp.y0, fb.y0);
        let d;
        if (overlap <= 0 && vOverlap > 0) d = Math.min(Math.abs(cp.x0 - fb.x1), Math.abs(cp.x1 - fb.x0)); // al lado (pie en la columna contigua)
        else if (overlap >= -20) d = Math.min(Math.abs(cp.y1 - fb.y0), Math.abs(cp.y0 - fb.y1));        // encima o debajo
        else continue;
        if (d < bd) { bd = d; best = fb; }
      }
      if (best && bd < body * 6 && !best.caption) { best.caption = cp; if (/^(table|tabla)/i.test(cp.text)) best.kind = "table"; } else { cp.type = "caption"; paras.push(cp); }
    }
    // inserta cada figura antes del primer párrafo que quede por debajo de ella (misma zona horizontal)
    const ordered = [];
    const pending = [...figBlocks].sort((a, b) => b.y1 - a.y1 || a.x0 - b.x0);   // de arriba abajo, izquierda a derecha
    for (const pr of paras) {
      for (let i = 0; i < pending.length;) {
        const fb = pending[i];
        const overlap = Math.min(pr.x1, fb.x1) - Math.max(pr.x0, fb.x0);
        if (overlap > 10 && pr.y1 <= fb.y0 + body) { ordered.push(fb); pending.splice(i, 1); } else i++;
      }
      ordered.push(pr);
    }
    ordered.push(...pending);
    // notas al pie (texto pequeño abajo) y barras laterales (texto pequeño fuera de la columna principal) van al final de la página
    const main = ordered.filter(b => b.type === "p" && b.size >= body * 0.95);
    const mainX0 = main.length ? Math.min(...main.map(b => b.x0)) : 0, mainX1 = main.length ? Math.max(...main.map(b => b.x1)) : pg.W;
    const foot = ordered.filter(b => b.type === "p" && b.size <= body * 0.9 && ((b.y1 < pg.H * 0.3 && b.nlines <= 6) || b.x1 <= mainX0 + 5 || b.x0 >= mainX1 - 5));
    for (const f of foot) f.type = "footnote";
    blocks.push(...ordered.filter(b => !foot.includes(b)), ...foot);
    onProgress?.(0.6 + 0.2 * pg.p / pages.length, `Ordenando página ${pg.p}`);
  }
  mergeContinuations(blocks);
  classify(blocks, body, pages);

  // figuras compuestas sin etiquetas de texto (letras "quemadas" en la imagen): si el pie enumera (A)…(N), buscar huecos blancos en la imagen
  if (opts.findPanelsInImage) {
    for (const b of blocks) {
      if (b.type !== "fig" || b.kind === "table" || !b.caption) continue;
      const n = countCaptionMarkers(b.caption.text); if (n < 2 || (b.panels && b.panels.length >= n)) continue;
      try {
        const rects = await opts.findPanelsInImage(pages[b.page - 1].page, b.rect, n);
        if (rects && rects.length >= 2 && rects.length > (b.panels?.length || 0)) b.panels = rects.map((r, i) => ({ label: String.fromCharCode(65 + i), rect: r }));
      } catch (e) { console.warn(e); }
    }
  }

  // --- recortes de figuras ---
  if (renderCrop) {
    const byPage = new Map();
    for (const b of blocks) if (b.type === "fig") { if (!byPage.has(b.page)) byPage.set(b.page, []); byPage.get(b.page).push(b); }
    let done = 0;
    for (const [p, figs] of byPage) {
      const pg = pages[p - 1];
      const rects = figs.map(f => { const pad = 3; return [Math.max(0, f.rect[0] - pad), Math.max(0, f.rect[1] - pad), Math.min(pg.W, f.rect[2] + pad), Math.min(pg.H, f.rect[3] + pad)]; });
      const panelRects = []; const owners = [];
      for (const f of figs) if (f.panels && f.kind !== "table") for (const pn of f.panels) { panelRects.push([Math.max(0, pn.rect[0] - 2), Math.max(0, pn.rect[1] - 2), Math.min(pg.W, pn.rect[2] + 2), Math.min(pg.H, pn.rect[3] + 2)]); owners.push(pn); }
      const imgs = await renderCrop(pg.page, [...rects, ...panelRects]);
      figs.forEach((f, i) => { f.img = imgs[i]; });
      owners.forEach((pn, i) => { pn.img = imgs[rects.length + i]; });
      done++; onProgress?.(0.8 + 0.2 * done / byPage.size, `Recortando figuras (${done}/${byPage.size})`);
    }
  }
  for (const pg of pages) { try { pg.page.cleanup(); } catch {} }
  let id = 0;
  return {
    pages: n, bodySize: body,
    blocks: blocks.map(b => {
      const out = { id: "b" + (id++), type: b.type, page: b.page };
      if (b.type === "fig") {
        out.rect = b.rect.map(v => Math.round(v * 10) / 10); out.img = b.img || null; out.kind = b.kind || "figure";
        if (b.caption) { out.caption = b.caption.text; out.captionRuns = b.caption.runs; out.captionSpans = b.caption.spans; }
        if (b.panels && b.kind !== "table") {
          const split = splitCaption(b.caption?.text, b.panels.map(p => p.label));
          out.panels = b.panels.map((p, i) => ({ label: p.label, rect: p.rect.map(v => Math.round(v * 10) / 10), img: p.img || null, caption: split ? split.per[p.label] : null }));
          if (split) out.captionCommon = split.common;
        }
      }
      else { out.text = b.text; out.runs = b.runs; out.spans = b.spans; }
      return out;
    }),
  };
}

/* ---------- 1. Figuras a partir del flujo de dibujo (imágenes + trazados) ---------- */
const big = c => (c.x1 - c.x0) >= 50 && (c.y1 - c.y0) >= 30;
function findFigures(ol, OPS, W, H) {
  const rects = []; const rules = [];
  let ctm = [1, 0, 0, 1, 0, 0]; const stack = [];
  const mul = (m, n) => [m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1], m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3], m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  const apply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  const bboxOf = (m, x0, y0, x1, y1) => { const pts = [apply(m, x0, y0), apply(m, x1, y0), apply(m, x0, y1), apply(m, x1, y1)]; return [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))]; };
  let pendingPath = null;
  const pageArea = W * H;
  const pushRect = (r, kind) => {
    const w = r[2] - r[0], h = r[3] - r[1];
    if (!(w > 0 && h > 0)) return;
    if (w * h > pageArea * 0.85) return;                        // fondo de página
    if (kind === "path" && h < 1.6 && w > W * 0.18) { rules.push({ x0: r[0], x1: r[2], y: (r[1] + r[3]) / 2 }); return; } // filete horizontal (tablas)
    if (kind === "path" && (h < 1.2 || w < 1.2) && (w > W * 0.25 || h > H * 0.25)) return; // otras reglas
    if (kind === "path" && w * h > pageArea * 0.5) return;
    rects.push({ x0: Math.max(0, r[0]), y0: Math.max(0, r[1]), x1: Math.min(W, r[2]), y1: Math.min(H, r[3]), kind });
  };
  for (let i = 0; i < ol.fnArray.length; i++) {
    const fn = ol.fnArray[i], a = ol.argsArray[i];
    switch (fn) {
      case OPS.save: stack.push(ctm); break;
      case OPS.restore: ctm = stack.pop() || ctm; break;
      case OPS.transform: ctm = mul(ctm, a); break;
      case OPS.paintFormXObjectBegin: stack.push(ctm); if (a[0]) ctm = mul(ctm, a[0]); break;
      case OPS.paintFormXObjectEnd: ctm = stack.pop() || ctm; break;
      case OPS.paintImageXObject: case OPS.paintInlineImageXObject: case OPS.paintImageMaskXObject: case OPS.paintImageXObjectRepeat:
        pushRect(bboxOf(ctm, 0, 0, 1, 1), "img"); break;
      case OPS.constructPath: {
        const mm = a[2]; if (mm && isFinite(mm[0]) && isFinite(mm[2]) && mm[2] > mm[0] - 1) pendingPath = bboxOf(ctm, mm[0], mm[1], mm[2], mm[3]); else pendingPath = null; break;
      }
      case OPS.fill: case OPS.eoFill: case OPS.stroke: case OPS.fillStroke: case OPS.eoFillStroke: case OPS.closeStroke: case OPS.closeFillStroke: case OPS.closeEOFillStroke:
        if (pendingPath) pushRect(pendingPath, "path"); pendingPath = null; break;
      case OPS.endPath: case OPS.clip: case OPS.eoClip: pendingPath = null; break;
    }
  }
  // agrupa rectángulos que se tocan o solapan → componentes; luego componentes lado a lado → figura con paneles
  const GAP = 4;
  const near = (a, b, g) => a.x0 <= b.x1 + g && b.x0 <= a.x1 + g && a.y0 <= b.y1 + g && b.y0 <= a.y1 + g;
  const union = (a, b) => ({ x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1), n: a.n + b.n, imgs: a.imgs + b.imgs, parts: [...(a.parts || [a]), ...(b.parts || [b])] });
  const mergeAll = (list, test) => {
    let merged = true;
    while (merged) {
      merged = false;
      outer: for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        if (test(list[i], list[j])) { list[i] = union(list[i], list[j]); list.splice(j, 1); merged = true; break outer; }
      }
    }
    return list;
  };
  let parts = mergeAll(rects.map(r => ({ ...r, n: 1, imgs: r.kind === "img" ? 1 : 0 })), (a, b) => near(a, b, GAP));
  parts = parts.map(c => ({ x0: c.x0, y0: c.y0, x1: c.x1, y1: c.y1, n: c.n, imgs: c.imgs }));
  // paneles de una misma figura: lado a lado (o uno sobre otro) con gran solape y poca distancia
  const sideBySide = (a, b) => { const ov = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0); const hmin = Math.min(a.y1 - a.y0, b.y1 - b.y0); return ov > 0.6 * hmin && hmin > 40 && a.x0 <= b.x1 + 40 && b.x0 <= a.x1 + 40; };
  const stacked = (a, b) => { const ov = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0); const wmin = Math.min(a.x1 - a.x0, b.x1 - b.x0); return ov > 0.6 * wmin && wmin > 50 && a.y0 <= b.y1 + 12 && b.y0 <= a.y1 + 12; };
  const figures = mergeAll(parts.map(c => ({ ...c, parts: [c] })), (a, b) => big(a) && big(b) && (sideBySide(a, b) || stacked(a, b)));
  const out = figures.filter(c => { const w = c.x1 - c.x0, h = c.y1 - c.y0; return w >= 50 && h >= 30 && w * h >= 3000 && (c.imgs > 0 || c.n >= 4); });
  out.rules = rules;
  return out;
}

/* ---------- 1b. Paneles (A, B, C…) dentro de una figura ---------- */

      progress(0.98, "Leyendo subrayados previos…");

const cropCanvas = document.createElement("canvas");

/* Divide una figura compuesta por sus huecos blancos (filas y luego columnas). Devuelve n rectángulos PDF o null */

    const alt = []; for (const [rx0, rx1] of cut(0, 0, w, h, "col")) for (const [ry0, ry1] of cut(rx0, 0, rx1 - rx0, h, "row")) alt.push([rx0, ry0, rx1, ry1]);

  return result.map(([cx0, cy0, cx1, cy1]) => { const [px0, py0] = vp.convertToPdfPoint(x + cx0, y + cy0), [px1, py1] = vp.convertToPdfPoint(x + cx1, y + cy1); return [Math.min(px0, px1), Math.min(py0, py1), Math.max(px0, px1), Math.max(py0, py1)].map(v => Math.round(v * 10) / 10); });
}

/* Subrayados que ya traiga el PDF (de esta u otra app) → anotaciones sobre el texto líquido */
async function importExistingAnnots(pdf, reflow) {

        const hit = locateRects(reflow, p, rects); if (!hit) continue;
        out.push({ id: uid(), block: hit.block, s: hit.s, e: hit.e, text: hit.text, color: nearestColor(a.color), style: a.subtype === "Underline" ? "ul" : "hl", note: a.contentsObj?.str || a.contents || "", created: Date.now() });

            else { cs = pos + Math.round((ox0 - x0) / w * len); ce = pos + Math.round((ox1 - x0) / w * len); }

/* =====================================================================
   EXPORTACIÓN
   ===================================================================== */
async function shareFile(bytes, name, type) {

  try { const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { try { await dl.save({ filename: name, data: blob }); toast("Guardado"); } catch (err) { if (err?.code !== "declined") toast("No se pudo guardar: " + (err?.message || err), 4000); } return; } } catch {}

  catch (err) { if (err.name === "AbortError") return; console.warn(err); }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

  let md = `# ${d.name}\n\n_Exportado el ${fmtDate(Date.now())} · ${nH} subrayados · ${nN} notas_\n`;
  let lastH = undefined;
  for (const a of list) {
    const h = heading(a.block); const p = byId.get(a.block.replace(/c$/, ""))?.page;
    if (h !== lastH) { md += `\n## ${h || "Inicio"}\n\n`; lastH = h; }
    if (a.e > a.s) { md += `- ==${a.text}== _(p. ${p})_\n`; if (a.note) md += `  > ${a.note.replace(/\n/g, "\n  > ")}\n`; }

}

}

    const cs = Math.max(a.s, rs), ce = Math.min(a.e, re);
    const fx0 = x0 + w * (cs - rs) / len, fx1 = x0 + w * (ce - rs) / len;
    if (!byPage.has(r.p)) byPage.set(r.p, []);
    const arr = byPage.get(r.p); const last = arr[arr.length - 1];
    if (last && Math.abs(last[1] - y0) < 1 && Math.abs(last[3] - y1) < 1 && fx0 - last[2] < 12) { last[2] = Math.max(last[2], fx1); last[0] = Math.min(last[0], fx0); }
    else arr.push([fx0, y0, fx1, y1]);

  return byPage;
}
async function buildAnnotatedPdf(d, reflow) {
  const { PDFDocument, PDFName, PDFString, PDFHexString } = PDFLib;
  const buf = await DB.getFile(d.id);
  const doc = await PDFDocument.load(buf, { ignoreEncryption: true, updateMetadata: false });
  const ctx = doc.context; const pages = doc.getPages();
  for (const p of pages) {   // el modelo de la app sustituye a las Highlight/Text existentes (se importaron al abrir)
    const annots = p.node.Annots(); if (!annots) continue;
    const keep = ctx.obj([]);
    for (let i = 0; i < annots.size(); i++) { const ref = annots.get(i); const dict = ctx.lookup(ref); const st = dict?.get?.(PDFName.of("Subtype"))?.toString?.(); if (st === "/Highlight" || st === "/Underline" || st === "/Text" || st === "/Popup") continue; keep.push(ref); }
    p.node.set(PDFName.of("Annots"), keep);
  }
  const gsRef = ctx.register(ctx.obj({ Type: "ExtGState", BM: "Multiply", CA: 1, ca: 1 }));
  const index = new Map(); for (const b of reflow.blocks) { index.set(b.id, b); if ((b.type === "fig" || b.type === "table") && b.caption) index.set(b.id + "c", { runs: b.captionRuns, page: b.page }); }
  for (const a of d.annots) {
    const block = index.get(a.block); if (!block) continue;
    const common = { Type: "Annot", F: 4, T: PDFHexString.fromText(AUTHOR), Contents: PDFHexString.fromText(a.note || ""), M: PDFString.fromDate(new Date(a.created || Date.now())), CA: 1 };
    if (a.e > a.s) {
      const byPage = annotRects(a, block); let first = true;
      for (const [pn, rects] of byPage) {
        const page = pages[pn - 1]; if (!page || !rects.length) continue;
        const [r, g, b] = COLORS[a.color] || COLORS.yellow;
        const rect = [Math.min(...rects.map(x => x[0])), Math.min(...rects.map(x => x[1])), Math.max(...rects.map(x => x[2])), Math.max(...rects.map(x => x[3]))];
        const quads = rects.flatMap(([x1, y1, x2, y2]) => [x1, y2, x2, y2, x1, y1, x2, y1]);
        const ul = a.style === "ul";
        const content = ul ? `${r} ${g} ${b} RG 1.5 w ` + rects.map(([x1, y1, x2, y2]) => `${x1.toFixed(2)} ${(y1 + 1).toFixed(2)} m ${x2.toFixed(2)} ${(y1 + 1).toFixed(2)} l S`).join(" ")
                           : `/GS gs ${r} ${g} ${b} rg ` + rects.map(([x1, y1, x2, y2]) => `${x1.toFixed(2)} ${y1.toFixed(2)} ${(x2 - x1).toFixed(2)} ${(y2 - y1).toFixed(2)} re f`).join(" ");
        const ap = ctx.stream(content, { Type: "XObject", Subtype: "Form", BBox: rect, Resources: { ExtGState: { GS: gsRef } } });
        const annot = ctx.obj({ ...common, Contents: PDFHexString.fromText(first ? (a.note || "") : ""), Subtype: ul ? "Underline" : "Highlight", Rect: rect, QuadPoints: quads, C: [r, g, b], P: page.ref, NM: PDFString.of(a.id + (first ? "" : "-" + pn)), AP: { N: ctx.register(ap) } });
        page.node.addAnnot(ctx.register(annot)); first = false;
      }
    } else {
      const page = pages[(block.page || 1) - 1]; if (!page) continue;
      const box = page.getCropBox?.() || page.getMediaBox();
      const runs = (block.runs || []).filter(r => r.r && r.p === block.page);
      const x = runs.length ? Math.min(...runs.map(r => r.r[0])) - 22 : box.x + 8, y = runs.length ? Math.max(...runs.map(r => r.r[3])) : box.y + box.height - 12;
      const annot = ctx.obj({ ...common, Subtype: "Text", Rect: [x, y - 20, x + 20, y], Name: "Comment", C: [1, 0.89, 0.36], Open: false, P: page.ref, NM: PDFString.of(a.id) });
      page.node.addAnnot(ctx.register(annot));
    }
  }
  return doc.save({ useObjectStreams: false });
}
async function exportPdf(d) {
  if (!d.annots.length) { toast("No hay anotaciones que exportar"); return; }
  toast("Preparando PDF…", 1200);
  try { const reflow = R.reflow && R.doc?.id === d.id ? R.reflow : await DB.getReflow(d.id); const bytes = await buildAnnotatedPdf(d, reflow); await shareFile(bytes, `${d.name.slice(0, 60)} (anotado).pdf`, "application/pdf"); }
  catch (err) { console.error(err); toast("No se pudo generar el PDF: " + (err.message || err), 4000); }
}
